<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">TEKINO logical module decomposition</title><desc id="desc">Logical modules of the TEKINO e-commerce system and their key interactions.</desc>
