.h{font:700 30px Arial,sans-serif;fill:#172033}.sub{font:16px Arial,sans-serif;fill:#526078}
.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:18}.head{font:700 19px Arial,sans-serif;fill:#172033}.body{font:15px Arial,sans-serif;fill:#334155}
.edge{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.note{font:14px Arial,sans-serif;fill:#64748b}
